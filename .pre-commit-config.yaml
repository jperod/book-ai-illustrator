# Pre-commit hooks. One-time setup (Linux and Windows alike):
#   uv sync
#   uv run pre-commit install
# Run on everything by hand:
#   uv run pre-commit run --all-files
#
# Ruff runs through `uv run`, so it uses the version locked in uv.lock (no second copy to keep in sync).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, with safe fixes)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
