<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Illustrator</title>
<style>
  :root {
    --bg: #f7f5f1;
    --panel: #ffffff;
    --text: #22201c;
    --muted: #77716a;
    --line: #dcd6cb;
    --accent: #2f2a24;
    --accent-text: #ffffff;
    --error: #a2302b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141310;
      --panel: #1d1c19;
      --text: #e9e6df;
      --muted: #8f8a80;
      --line: #34322d;
      --accent: #e9e6df;
      --accent-text: #141310;
      --error: #f08a80;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .layout {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 16px 64px;
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 32px;
    align-items: start;
  }

  /* Sidebar: list of books */
  .sidebar { position: sticky; top: 24px; }
  .sidebar h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #books { display: flex; flex-direction: column; gap: 4px; }
  .book-row {
    display: flex;
    align-items: stretch;
    border: 1px solid transparent;
    border-radius: 6px;
  }
  .book-row:hover { border-color: var(--line); }
  .book-row.active { background: var(--panel); border-color: var(--line); }
  .book {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    color: var(--text);
    border: 0;
    padding: 10px 12px;
    font: inherit;
    cursor: pointer;
  }
  .book .title { display: block; font-weight: 600; }
  .book .meta { display: block; font-size: 12px; color: var(--muted); }
  .pin {
    background: none;
    border: 0;
    padding: 0 10px;
    font-size: 16px;
    color: var(--muted);
    cursor: pointer;
  }
  .pin:hover, .pin.pinned { color: var(--text); }

  /* Main column */
  .content {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  textarea {
    width: 100%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 1px solid var(--muted); }
  #text { min-height: 240px; }
  #scene { min-height: 90px; }

  .narrator {
    padding: 10px 12px 0;
    color: var(--muted);
    font-size: 13px;
  }
  .narrator select {
    margin-left: 8px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    font: inherit;
  }

  #promptBox summary { border-bottom: none; }
  #promptText {
    margin: 0;
    padding: 12px;
    white-space: pre-wrap;
    font: 13px/1.5 ui-monospace, Consolas, monospace;
    color: var(--text);
    border-top: 1px solid var(--line);
  }

  details {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
  }
  summary {
    cursor: pointer;
    padding: 10px 12px;
    color: var(--muted);
    user-select: none;
  }
  details[open] summary { border-bottom: 1px solid var(--line); }
  details textarea {
    border: 0;
    border-radius: 0 0 6px 6px;
    min-height: 180px;
  }
  details textarea:focus { outline: none; }

  button#go {
    align-self: flex-start;
    background: var(--accent);
    color: var(--accent-text);
    border: 0;
    border-radius: 6px;
    padding: 10px 22px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button#go:disabled { opacity: 0.5; cursor: progress; }

  #progress { display: flex; flex-direction: column; gap: 6px; }
  #bar {
    position: relative;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  #fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0;
    background: var(--accent);
    transition: width 0.3s;
  }
  #bar.indeterminate #fill {
    width: 35%;
    transition: none;
    animation: slide 1.2s linear infinite;
  }
  @keyframes slide {
    from { left: -35%; }
    to { left: 100%; }
  }
  #stage { color: var(--muted); font-size: 13px; }

  #status {
    color: var(--muted);
    font-size: 13px;
    min-height: 1.2em;
    white-space: pre-wrap;
  }
  #status.error { color: var(--error); }

  #result img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  /* Timing chart and debug log, in the sidebar */
  .timing { margin-top: 24px; }
  .trow { margin-bottom: 9px; }
  .tline {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .ttrack {
    height: 5px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 3px;
  }
  .tbar {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    min-width: 2px;
  }
  .tmodel { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tbar.llm { background: #5b7c99; }
  .tbar.image { background: var(--accent); }
  .tbar.app { background: var(--muted); }
  .ttotal { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .logbox { margin-top: 24px; }
  .logbox pre {
    margin: 0;
    max-height: 320px;
    overflow: auto;
    padding: 8px 10px;
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  /* Narrow screens: the book list moves above the page as a row of chips */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .sidebar { position: static; }
    #books { flex-direction: row; flex-wrap: wrap; }
    .book-row { width: auto; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>Books</h2>
    <nav id="books" aria-label="Books"></nav>
    <section id="timing" class="timing" hidden>
      <h2>Last image</h2>
      <div id="timingRows"></div>
      <div id="timingTotal" class="ttotal"></div>
    </section>
    <details id="logBox" class="logbox">
      <summary>Debug log</summary>
      <pre id="logText"></pre>
    </details>
  </aside>

  <main class="content">
    <textarea id="text" placeholder="Paste a page of the book here"></textarea>
    <textarea id="scene" placeholder="Optional: describe the moment in 2–3 visible sentences. Leave empty to use the page."></textarea>

    <details id="styleBox">
      <summary>Visual style</summary>
      <textarea id="style" placeholder="Art style, palette, lighting, mood…"></textarea>
    </details>

    <details id="charsBox">
      <summary>Characters</summary>
      <div class="narrator">
        Narrator
        <select id="narrator" aria-label="Narrator">
          <option value="">None</option>
        </select>
      </div>
      <textarea id="characters" placeholder="One per line, name first:&#10;Hero: tall, dark hair, grey wool cloak&#10;Companion: small white dog, red collar"></textarea>
    </details>

    <button id="go">Generate</button>
    <div id="progress" hidden>
      <div id="bar"><div id="fill"></div></div>
      <div id="stage"></div>
    </div>
    <div id="status"></div>
    <div id="result"></div>
    <details id="promptBox" hidden>
      <summary>Prompt used</summary>
      <pre id="promptText"></pre>
    </details>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const booksEl = $("books");
  const textEl = $("text");
  const styleEl = $("style");
  const charsEl = $("characters");
  const styleBox = $("styleBox");
  const charsBox = $("charsBox");
  const goBtn = $("go");
  const statusEl = $("status");
  const resultEl = $("result");
  const narratorEl = $("narrator");
  const sceneEl = $("scene");
  const promptBox = $("promptBox");
  const promptText = $("promptText");
  let currentBook = "";

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", isError);
  }

  function setBar(value, max, label) {
    const bar = $("bar");
    const fill = $("fill");
    if (max > 0) {
      bar.classList.remove("indeterminate");
      fill.style.width = Math.min(100, (value / max) * 100) + "%";
    } else {
      bar.classList.add("indeterminate");
      fill.style.width = "";
    }
    $("stage").textContent = label;
  }

  async function pollProgress() {
    try {
      const p = await (await fetch("/api/progress")).json();
      if (!p.active) return;
      const label = (p.label || "Working") + (p.max > 0 ? ` — step ${p.value} of ${p.max}` : "");
      setBar(p.value, p.max, label);
    } catch (e) { /* ignore a missed poll */ }
  }

  // Character names are the part of each 'Name: description' line before the colon.
  function characterNames() {
    const names = [];
    for (const line of charsEl.value.split("\n")) {
      const i = line.indexOf(":");
      if (i < 0) continue;
      const name = line.slice(0, i).trim();
      if (name && line.slice(i + 1).trim()) names.push(name);
    }
    return names;
  }

  function refreshNarratorOptions(selected) {
    const names = characterNames();
    narratorEl.replaceChildren(
      new Option("None", ""),
      ...names.map((n) => new Option(n, n)),
    );
    narratorEl.value = names.includes(selected) ? selected : "";
  }

  // The default book is saved on the server, so it survives restarts and browser changes.
  let defaultBook = "";

  async function loadSettings() {
    try {
      const s = await (await fetch("/api/settings")).json();
      defaultBook = s.default_book || "";
    } catch (e) {
      defaultBook = "";
    }
  }

  function renderPins() {
    for (const row of booksEl.children) {
      const pin = row.querySelector(".pin");
      const pinned = row.dataset.id === defaultBook;
      pin.classList.toggle("pinned", pinned);
      pin.textContent = pinned ? "★" : "☆";
      pin.title = pinned ? "Default book (click to clear)" : "Make this the default book";
      pin.setAttribute("aria-label", pin.title);
    }
  }

  async function setDefaultBook(id) {
    const next = id === defaultBook ? "" : id;
    try {
      const r = await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ default_book: next }),
      });
      if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
      defaultBook = next;
      renderPins();
      setStatus(next ? "Default book saved." : "Default cleared. The first book is used.");
    } catch (e) {
      setStatus("Could not save the default book: " + e.message, true);
    }
  }

  async function loadBooks() {
    try {
      const books = await (await fetch("/api/books")).json();
      if (!books.length) {
        setStatus("No books found in the books folder.", true);
        return;
      }
      booksEl.replaceChildren(...books.map((b) => {
        const row = document.createElement("div");
        row.className = "book-row";
        row.dataset.id = b.id;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "book";
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = b.title;
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = [b.series, b.book_number ? `Book ${b.book_number}` : ""].filter(Boolean).join(" · ");
        btn.append(title, meta);
        btn.addEventListener("click", () => selectBook(b.id));
        const pin = document.createElement("button");
        pin.type = "button";
        pin.className = "pin";
        pin.addEventListener("click", () => setDefaultBook(b.id));
        row.append(btn, pin);
        return row;
      }));
      await loadSettings();
      renderPins();
      // Start with the pinned book if it still exists, otherwise the first one.
      const start = books.some((b) => b.id === defaultBook) ? defaultBook : books[0].id;
      await selectBook(start);
    } catch (e) {
      setStatus("The local server is not responding.", true);
    }
  }

  // Picking a book fills in its visual style and characters.
  async function selectBook(id) {
    try {
      const r = await fetch(`/api/books/${encodeURIComponent(id)}`);
      if (!r.ok) throw new Error("unknown book");
      const b = await r.json();
      currentBook = id;
      for (const row of booksEl.children) {
        row.classList.toggle("active", row.dataset.id === id);
      }
      styleEl.value = b.visual_style || "";
      charsEl.value = b.characters_text || "";
      refreshNarratorOptions(b.narrator || "");
      // Open each box only when it is empty.
      styleBox.open = !styleEl.value.trim();
      charsBox.open = !charsEl.value.trim();
    } catch (e) {
      setStatus("Could not load that book.", true);
    }
  }

  // Save a field to the book it was typed in, shortly after typing stops.
  function autosave(el, field) {
    let timer = null;
    el.addEventListener("input", () => {
      const bookId = currentBook;
      const value = el.value;
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (!bookId) return;
        fetch(`/api/books/${encodeURIComponent(bookId)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [field]: value }),
        }).catch(() => {});
      }, 800);
    });
  }
  autosave(styleEl, "visual_style");
  autosave(charsEl, "characters_text");
  charsEl.addEventListener("input", () => refreshNarratorOptions(narratorEl.value));

  narratorEl.addEventListener("change", () => {
    if (!currentBook) return;
    fetch(`/api/books/${encodeURIComponent(currentBook)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ narrator: narratorEl.value }),
    }).catch(() => {});
  });

  async function checkStatus() {
    try {
      const s = await (await fetch("/api/status")).json();
      if (!s.comfy_ok) setStatus(`ComfyUI is not running (${s.comfy_url}). Start it first.`, true);
      else if (!s.workflow_ok) setStatus("workflow_api.json is missing. See README.md.", true);
    } catch (e) {
      setStatus("The local server is not responding.", true);
    }
  }

  // Time breakdown of the last image, drawn as bars in the sidebar.
  function renderTiming(timeline, total) {
    const max = Math.max(0.01, ...timeline.map((s) => s.seconds));
    $("timingRows").replaceChildren(...timeline.map((s) => {
      const row = document.createElement("div");
      row.className = "trow";
      const line = document.createElement("div");
      line.className = "tline";
      const name = document.createElement("span");
      name.textContent = s.stage;
      const secs = document.createElement("span");
      secs.textContent = `${s.seconds.toFixed(2)} s`;
      line.append(name, secs);
      // Names the model that ran this step: "LLM · qwen3:8b (GPU)" or "Image · flux-2-klein-4b-fp8...".
      const model = document.createElement("div");
      model.className = "tmodel";
      const who = s.kind === "llm" ? "LLM" : s.kind === "image" ? "Image" : "";
      model.textContent = [who, s.model].filter(Boolean).join(" · ");
      const track = document.createElement("div");
      track.className = "ttrack";
      const bar = document.createElement("div");
      bar.className = `tbar ${s.kind || "app"}`;
      bar.style.width = `${((s.seconds / max) * 100).toFixed(1)}%`;
      track.append(bar);
      row.append(line, model, track);
      return row;
    }));
    $("timingTotal").textContent = `Total ${total.toFixed(2)} s`;
    $("timing").hidden = false;
  }

  // Debug log: streams from the server while the panel is open.
  let logSeq = 0;
  let logTimer = null;
  async function pollLog() {
    try {
      const d = await (await fetch(`/api/log?after=${logSeq}`)).json();
      if (!d.entries.length) return;
      logSeq = d.last;
      const pre = $("logText");
      for (const e of d.entries) {
        pre.textContent += `${e.time} ${e.level.padEnd(5)} ${e.msg}\n`;
        const f = e.fields || {};
        if (f.traceback) {
          pre.textContent += f.traceback;
        } else if (Object.keys(f).length) {
          pre.textContent += `    ${JSON.stringify(f)}\n`;
        }
      }
      pre.scrollTop = pre.scrollHeight;
    } catch (err) {
      /* the server is not reachable right now; the next poll tries again */
    }
  }
  $("logBox").addEventListener("toggle", () => {
    clearInterval(logTimer);
    if ($("logBox").open) {
      pollLog();
      logTimer = setInterval(pollLog, 1000);
    }
  });

  async function generate() {
    // The button is disabled while a run is in progress; Ctrl+Enter must not bypass that.
    if (goBtn.disabled) return;
    const text = textEl.value.trim();
    if (!text) {
      setStatus("Paste some text first.", true);
      textEl.focus();
      return;
    }
    goBtn.disabled = true;
    $("progress").hidden = false;
    setBar(0, 0, "Starting…");
    const poll = setInterval(pollProgress, 300);
    setStatus("");
    const started = performance.now();
    try {
      const r = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text,
          scene: sceneEl.value,
          book: currentBook,
          visual_style: styleEl.value,
          characters_text: charsEl.value,
        }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);

      const img = document.createElement("img");
      img.alt = "Illustration";
      img.src = data.image_url + "?t=" + Date.now();
      resultEl.replaceChildren(img);
      promptText.textContent = data.prompt || "";
      promptBox.hidden = false;
      setBar(1, 1, "Done");
      const p = data.planner || {};
      const who = p.used ? ` · planner ${p.seconds} s: ${p.present.join(", ") || "no one"}` : "";
      setStatus(`Done in ${((performance.now() - started) / 1000).toFixed(1)} s${who}`);
      renderTiming(data.timeline || [], data.total_seconds || 0);
    } catch (e) {
      $("progress").hidden = true;
      setStatus("Error: " + e.message, true);
    } finally {
      clearInterval(poll);
      goBtn.disabled = false;
    }
  }

  goBtn.addEventListener("click", generate);
  textEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
  });

  loadBooks();
  checkStatus();
</script>
</body>
</html>
